.badge{background:#5b6bd0;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.sw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:30px}
details{border-bottom:1px solid var(--ln);padding:12px 0}summary{font-weight:600;cursor:pointer}details p{color:var(--mu);margin-top:8px}

button:focus-visible{outline:2px solid #888;outline-offset:2px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}

<div class="row" style="margin:14px 0"><div class="stat">${ic('clock',20)}<b>${p.tm}</b>срок</div><div class="stat">${ic('doc',20)}<b>${p.f}</b>формат</div><div class="stat">${ic('shield',20)}<b>Автор</b>материал</div></div>
<h2 style="margin-top:6px">Описание</h2><p class="mu">${esc(p.d)} Сумму продавец называет в чате заказа.</p>
${S.role=='buyer'?`<button class="btn" onclick="order(${p.id})">Заказать</button><button class="btn g" onclick="fav(${p.id})">${S.fav.has(p.id)?'Убрать из избранного':'В избранное'}</button>`:''}`},
newad(){const d=S.dr;return `<p class="mu" style="margin:0 2px 12px">Опишите, какая помощь нужна. Цену укажет исполнитель в чате заказа.</p>
<input placeholder="Заголовок" value="${esc(d.t||'')}" oninput="S.dr.t=this.value">
<select onchange="S.dr.c=this.value">${CATS.map(c=>`<option ${d.c==c[0]?'selected':''}>${c[0]}</option>`).join('')}</select>
<select onchange="S.dr.ty=this.value">${TY.map(t=>`<option ${d.ty==t?'selected':''}>${t}</option>`).join('')}</select>
<textarea placeholder="Что нужно сделать: тема, требования, методичка" oninput="S.dr.d=this.value">${esc(d.d||'')}</textarea>
<div class="mu" style="margin-bottom:6px">Срок</div>${TM.map(t=>`<button class="chip ${(d.tm||TM[1])==t?'on':''}" onclick="S.dr.tm='${t}';draw()">${t}</button>`).join('')}
<label class="row" style="margin:10px 0;font-size:13px;color:var(--mu)"><input type="checkbox" style="width:22px;margin:0" ${d.ok?'checked':''} onchange="S.dr.ok=this.checked">Мне нужна помощь в учёбе. Чужую работу под своим именем я сдавать не буду.</label>
<button class="btn" onclick="publish()">Опубликовать</button>`},
ad(id){const a=ad(id),mine=S.role=='buyer'&&a.b==5734;return `<div class="card"><div class="row"><div class="ic">${ic(ci(a.c))}</div><div class="sp"><b>${esc(a.t)}</b><div class="mu">${a.c}</div></div></div><p class="mu" style="margin-top:10px">${esc(a.d)}</p><div class="row" style="margin-top:10px"><span class="tag">${a.ty}</span><span class="tag">Срок: ${a.tm}</span></div><p class="mu" style="margin-top:10px">Автор: Покупатель №${a.b}</p></div>
${S.role=='seller'?(a.rs.includes(1048)?'<div class="card mu">Вы откликнулись. Ждите решения покупателя.</div>':`<button class="btn" onclick="respond(${id})">Откликнуться</button>`):''}
${mine?`<h2>Отклики</h2>${a.rs.map(s=>`<div class="card row"><div class="ic">${cap(26)}</div><div class="sp"><b>Продавец №${s}</b><div class="mu">★ 4.9 · 842 заказа</div></div><button class="chip on" style="margin:0" onclick="pick(${id},${s})">Выбрать</button></div>`).join('')||'<div class="card mu">Откликов пока нет.</div>'}`:''}`},
myads(){const l=S.ads.filter(a=>a.b==5734);return l.map(cardA).join('')||'<div class="card mu">У вас нет объявлений.</div>'},
orders(){return (S.role=='admin'?`<div>${[['all','Все'],['rev','На проверке']].map(f=>`<button class="chip ${S.of==f[0]?'on':''}" onclick="S.of='${f[0]}';draw()">${f[1]}</button>`).join('')}</div>`:'')+ordList()},
order(id){const o=or(id),R=S.role,a=o.amt;let x='';
 if(R=='buyer'){if(o.st==0)x='<div class="card mu">Продавец назовёт сумму. Обсудите детали в чате заказа.</div>';
  if(o.st==1)x=`<button class="btn" onclick="step(${id},2,'Сумма принята')">Принять сумму ${rub(a)}</button><button class="btn g" onclick="o_(${id})">Отказаться и отменить заказ</button>`;
  if(o.st==2)x=`<div class="card mu">Переведите ${rub(a)} напрямую продавцу по реквизитам из чата. Платформа деньги не принимает.</div><button class="btn" onclick="step(${id},3,'Вы сообщили о переводе')">Я оплатил(а)</button>`;
  if(o.st<=2)x+=`<button class="btn r" onclick="step(${id},8,'Заказ отменён')">Отменить заказ</button>`;
  if(o.st==5)x='<div class="card mu">Администратор проверяет выполнение заказа.</div>';
  if(o.st==6)x=`<div class="card mu">Администратор одобрил заказ. Осталось подтвердить получение.</div><button class="btn" onclick="step(${id},7,'Заказ выполнен, учёт обновлён')">Подтвердить получение</button><button class="btn r" onclick="complain(${id})">Сообщить о проблеме</button>`;
  if(o.st==7)x=o.rv?`<div class="card">Ваша оценка: ${'★'.repeat(o.rv)}</div>`:`<div class="card"><b>Оцените заказ</b><div>${[1,2,3,4,5].map(n=>`<button class="star" style="opacity:${n<=((S.rs&&S.rs[id])||0)?1:.3}" onclick="pick5(${id},${n})">★</button>`).join('')}</div><button class="btn" style="margin-top:6px" ${(S.rs&&S.rs[id])?'':'disabled'} onclick="rate(${id},S.rs[${id}])">Подтвердить</button></div>`}
 if(R=='seller'){if(o.st==0)x=`<div class="card"><b>Назовите сумму</b><p class="mu" style="margin:4px 0 8px">Сумма видна только участникам заказа. Назвать её можно один раз: после этого изменить её нельзя.</p><input id="am" type="number" min="1" placeholder="Сумма, BYN"></div><button class="btn" onclick="propose(${id})">Предложить сумму</button>`;
  if(o.st==1)x='<div class="card mu">Сумма зафиксирована и не меняется. Ждём ответа покупателя.</div>';
  if(o.st==3)x=`<div class="card mu">Покупатель сообщил о переводе. Ваше подтверждение — это сообщение о получении, а не банковская проверка.</div><button class="btn" onclick="step(${id},4,'Получение подтверждено')">Подтверждаю получение перевода</button>`;
  if(o.st==4)x=`<button class="btn" onclick="step(${id},5,'Отправлено на проверку администратору')">Сообщить о выполнении</button>`;if(o.st==5)x='<div class="card mu">Заказ на проверке у администратора.</div>';if(o.st==6)x='<div class="card mu">Администратор одобрил заказ. Ждём подтверждения покупателя.</div>'}
 if(R=='admin')x=(o.st==5?`<div class="card mu">Проверьте выполнение: утвердите заказ или верните на доработку.</div><button class="btn" onclick="step(${id},6,'Заказ утверждён')">Утвердить</button><button class="btn r" onclick="step(${id},4,'Возвращён на доработку')">Отклонить</button>`:o.st==6?'<div class="card mu">Заказ одобрен. Выполненным он станет после подтверждения покупателя.</div>':'')+`<button class="btn g" onclick="adminChat(${id})">Открыть переписку (проверка)</button>`;
 return `<div class="card row"><div class="pp"></div><div class="sp"><b>${esc(o.t)}</b><div class="mu">Заказ №${id} · ${who(o)}</div></div>${tagO(o)}</div>
${a?`<div class="card"><div class="row"><span>Сумма заказа</span><span class="sp"></span>${rub(a)}</div><div class="row mu"><span>Комиссия STUDEX (20%)</span><span class="sp"></span>${rub(fee(a))}</div><div class="row" style="border-top:1px solid var(--ln);margin-top:8px;padding-top:8px"><b>Продавцу после комиссии</b><span class="sp"></span><b>${rub(a-fee(a))}</b></div></div>`:''}${x}${R=='admin'?'':`<button class="btn g" onclick="go('chat',${id})">Чат по заказу</button>`}`},
chats(){return S.orders.map(o=>{const m=S.msgs[o.id]||[],l=m[m.length-1];return `<div class="card row cl" onclick="go('chat',${o.id})"><div class="ic" style="border-radius:50%;width:50px;height:50px">${cap(30)}</div><div class="sp"><div class="row"><b>Заказ №${o.id}</b><span class="sp"></span><span class="mu">${l?l[2]:''}</span></div><div class="mu">${who(o)}: ${l?esc(l[1]).slice(0,34):'пока нет сообщений'}</div></div></div>`}).join('')||'<div class="card mu">Чаты появляются вместе с заказами.</div>'},
chat(id){const me=S.role=='seller'?'s':'b';return `<div class="ban">${ic('shield',22)}Чат защищён. Ваши данные скрыты: имя, телефон и фото не показываются.</div>${(o=>`<div class="card row cl" style="position:sticky;top:0;z-index:2;margin-bottom:8px" onclick="go('order',${id})"><div class="ic">${ic('rub')}</div><div class="sp"><div class="mu">Сумма заказа</div><b style="font-size:18px">${o.amt?rub(o.amt):'Не согласована'}</b></div>${tagO(o)}</div>${S.role=='seller'&&o.st==0?`<div class="card"><div class="mu" style="margin-bottom:6px">Назовите сумму в BYN. Её можно указать только один раз.</div><div class="row"><input id="am" type="number" min="1" placeholder="Сумма, BYN" style="margin:0"><button class="chip on" style="margin:0;white-space:nowrap" onclick="propose(${id})">Назвать</button></div></div>`:''}`)(or(id))}<div id="ms">${msgs(id,me)}</div>`},
profile(){const n={buyer:7421,seller:1048,admin:0}[S.role];return `<div style="text-align:center;margin:8px 0 14px"><div class="ic" style="width:96px;height:96px;border-radius:50%;margin:0 auto 10px">${cap(56)}</div><h2 style="margin:0">${S.role=='admin'?'Администратор':(S.role=='seller'?'Продавец':'Студент')+' №'+n}</h2><div class="mu">★ 4.9 · 124 заказа</div></div>
<div class="row" style="margin-bottom:12px"><div class="stat"><b>98</b>Покупок</div><div class="stat"><b>32</b>Продаж</div><div class="stat"><b>4.9</b>Рейтинг</div></div>
<div class="card cl" onclick="go('orders')">Мои заказы</div>${S.role=='buyer'?`<div class="card cl" onclick="go('bal')">Мои расходы: ${rub(spent())}</div><div class="card cl" onclick="go('myads')">Мои объявления</div><div class="card cl" onclick="go('fav')">Избранное: ${S.fav.size}</div>`:''}<div class="card cl" onclick="go('about')">О платформе</div><div class="card cl" onclick="S.reg=1;S.rg=null;draw()">Экран регистрации (демо)</div><div class="card cl" onclick="go('policy')">Политика и правила</div>
<h2>Роль в демо</h2>${Object.keys(ROLES).map(r=>`<button class="chip ${S.role==r?'on':''}" onclick="setRole('${r}')">${ROLES[r]}</button>`).join('')}
<p class="mu" style="margin:12px 2px">Демо-режим: данные хранятся только в этой вкладке. Сервер и база не подключены.</p>`},
fav(){const l=P.filter(p=>S.fav.has(p.id));return l.length?l.map(cardP).join(''):'<div class="card mu">В избранном пусто. Нажмите сердечко на карточке.</div>'},
finance(){return `<div class="card"><div class="mu">Начислено комиссии (20%)</div><div style="font-size:30px;font-weight:700">${rub(accrued())}</div><div class="row mu" style="margin-top:6px"><span>Передано наличными</span><span class="sp"></span>${rub(S.cash)}</div><div class="row" style="margin-top:4px"><b>${debt()>=0?'Долг перед платформой':'Переплата'}</b><span class="sp"></span><b>${rub(Math.abs(debt()))}</b></div></div><div class="card"><div class="mu">Заработано (после комиссии)</div><div style="font-size:26px;font-weight:700">${rub(earn())}</div><div class="mu">Деньги вы получили напрямую от покупателей. Это учёт: платформа их не хранит.</div></div><p class="mu" style="margin:0 2px">Комиссия передаётся наличными раз в неделю (пн–вс). Частичная оплата допускается, остаток переносится.</p><h2>Завершённые заказы</h2>${done().map(o=>`<div class="card row"><span>№${o.id}</span><span class="sp"></span><span>${rub(o.amt)} · комиссия ${rub(fee(o.amt))}</span></div>`).join('')||'<div class="card mu">Пока нет завершённых заказов.</div>'}`},
dash(){const ds=done(),sales=ds.reduce((a,o)=>a+o.amt,0);return `<div class="grid2">${[['Заказов',S.orders.length],['Выполнено',ds.length],['Продажи',rub(sales)],['Средний чек',rub(ds.length?Math.round(sales/ds.length):0)],['Начислено',rub(accrued())],['Долг продавцов',rub(Math.max(debt(),0))],['На проверке',S.orders.filter(o=>o.st==5).length],['Отменено',S.orders.filter(o=>o.st==8).length]].map(x=>`<div class="card"><div class="mu">${x[0]}</div><b style="font-size:18px">${x[1]}</b></div>`).join('')}</div>
<h2>Наличная комиссия за неделю</h2><div class="card"><input id="cs" type="number" min="1" placeholder="Получено наличными, BYN"><button class="btn" style="margin:0" onclick="cash()">Записать получение</button></div>
<button class="btn" onclick="S.of='rev';setTab('orders')">Заказы на проверку: ${S.orders.filter(o=>o.st==5).length}</button><h2>Жалобы</h2>${S.cmp.filter(c=>c.open).map(c=>`<div class="card"><b>Жалоба по заказу №${c.o}</b><div style="margin-top:8px"><button class="chip" onclick="decide(${c.id},'b')">В пользу покупателя</button><button class="chip" onclick="decide(${c.id},'s')">В пользу продавца</button><button class="chip" onclick="decide(${c.id},'x')">Закрыть</button></div></div>`).join('')||'<div class="card mu">Открытых жалоб нет.</div>'}<h2>Журнал действий</h2>${S.audit.map(a=>`<div class="card mu">${a}</div>`).join('')||'<div class="card mu">Записей пока нет.</div>'}<div class="card mu">Резервная копия станет доступна директору после подключения сервера.</div>`},
policy(){const T=window.PT=[['О STUDEX','Платформа помогает студентам находить учебные материалы, получать объяснения и обмениваться знаниями.'],['Академическая честность','Запрещены плагиат, продажа ответов на экзамены, выполнение заданий для выдачи чужой работы за свою и чужие материалы без прав. Разрешены авторские конспекты, шаблоны, консультации, репетиторство, образцы и разборы для обучения.'],['Объявления покупателей','В объявлении опишите, какая помощь нужна. Цена в объявлениях не указывается: сумму называет исполнитель в чате заказа.'],['Правила продавцов','Размещайте только законные материалы с правами на них, корректно описывайте предложения и вовремя передавайте комиссию.'],['Финансовые правила','Комиссия STUDEX — 20%. Покупатель переводит деньги напрямую продавцу. Продавец передаёт комиссию наличными раз в неделю.'],['Возвраты и жалобы','Возврат выполняет продавец. Администратор рассматривает спор и может одобрить переделку, частичный или полный возврат.'],['Конфиденциальность','Участники заказа видят друг друга только по номерам. Администратор может открыть переписку при жалобе, каждый просмотр записывается в журнал.']];
 return `<input placeholder="Поиск по правилам" oninput="pol(this.value)"><div id="pl">${polHtml(T,'')}</div><p class="mu" style="margin-top:12px">Версия 0.1. Текст не прошёл юридическую проверку.</p>`}};
V.mod=()=>`<h2 style="margin-top:6px">Предложения</h2>${P.map(p=>`<div class="card row"><div class="sp"><b>${esc(p.t)}</b><div class="mu">Продавец №${p.s}${hid('o'+p.id)?' · скрыто':''}</div></div><button class="chip" style="margin:0" onclick="hide('o${p.id}')">${hid('o'+p.id)?'Показать':'Скрыть'}</button></div>`).join('')}<h2>Объявления</h2>${S.ads.map(a=>`<div class="card row"><div class="sp"><b>${esc(a.t)}</b><div class="mu">Покупатель №${a.b}${hid('a'+a.id)?' · скрыто':''}</div></div><button class="chip" style="margin:0" onclick="hide('a${a.id}')">${hid('a'+a.id)?'Показать':'Скрыть'}</button></div>`).join('')||'<div class="card mu">Объявлений нет.</div>'}`;
V.users=()=>`<p class="mu" style="margin:4px 2px 10px">Заблокированные пользователи скрываются из каталога и объявлений.</p>${S.users.map(u=>`<div class="card row"><div class="sp"><b>${u.r} №${u.n}</b><div class="mu">${u.bl?'Заблокирован':'Активен'}</div></div><button class="chip ${u.bl?'on':''}" style="margin:0" onclick="block(${u.n})">${u.bl?'Разблокировать':'Заблокировать'}</button></div>`).join('')}`;
function hide(k){const i=S.hid.indexOf(k);i<0?S.hid.push(k):S.hid.splice(i,1);S.audit.unshift((i<0?'Скрыто ':'Показано ')+k+' · '+now());draw()}
function block(n){const u=S.users.find(x=>x.n==n);u.bl=!u.bl;S.audit.unshift((u.bl?'Заблокирован ':'Разблокирован ')+u.r+' №'+n+' · '+now());toast(u.bl?'Заблокирован':'Разблокирован');draw()}
function complain(id){S.cmp.push({id:S.cid++,o:id,open:true});sys(id,'Покупатель сообщил о проблеме');toast('Жалоба отправлена администратору');draw()}
function decide(cid,r){const c=S.cmp.find(x=>x.id==cid);c.open=false;if(r=='b')step(c.o,8,'Решено в пользу покупателя: заказ отменён');else if(r=='s')step(c.o,7,'Решено в пользу продавца: заказ завершён');else{S.audit.unshift('Жалоба №'+cid+' закрыта · '+now());toast('Жалоба закрыта');draw()}}
V.about=()=>`<div class="hero" style="padding:26px 20px"><h3 style="font-size:28px">Знания живут там, где ими делятся.</h3><p class="mu" style="margin-top:10px;font-size:15px">STUDEX — место, где студенты находят нужные материалы, помощь и людей, которые уже прошли этот путь.</p></div>
<p style="font-size:17px;line-height:1.5;margin:16px 4px">Сессия, чертёж, реферат, незнакомая тема за одну ночь. Знакомо? Здесь не нужно искать по чатам и просить у всех подряд. Откройте каталог или напишите объявление: кто-то уже умеет то, что вам нужно.</p>
<div class="card"><b style="font-size:19px">Учись.</b><div class="mu">Разбирайтесь в теме с теми, кто объяснит простым языком.</div></div>
<div class="card"><b style="font-size:19px">Находи.</b><div class="mu">Конспекты, образцы, консультации и репетиторов в одном месте.</div></div>
<div class="card"><b style="font-size:19px">Развивайся.</b><div class="mu">Берите то, что сделает вас сильнее, и делитесь своим.</div></div>
<h2>Как пользоваться покупателю</h2>
<div class="card"><b>1. Найдите или попросите</b><div class="mu">Выберите предложение в каталоге. Не нашли своё? Нажмите «Создать объявление» и опишите, какая помощь нужна. Цену указывать не нужно.</div></div>
<div class="card"><b>2. Обсудите детали в чате</b><div class="mu">После заказа или выбора исполнителя откроется защищённый чат. Вы видите друг друга только по номерам.</div></div>
<div class="card"><b>3. Согласуйте сумму</b><div class="mu">Продавец называет сумму в заказе, вы принимаете её или отклоняете.</div></div>
<div class="card"><b>4. Оплатите напрямую продавцу</b><div class="mu">Переведите деньги продавцу в своём банковском приложении и нажмите «Я оплатил(а)». STUDEX не принимает деньги покупателей.</div></div>
<div class="card"><b>5. Дождитесь результата</b><div class="mu">Продавец выполняет заказ, а администратор проверяет его и одобряет или возвращает на доработку.</div></div>

function regGo(m){const g=S.rg;if(!g.ok)return toast('Примите правила платформы');let r='buyer';if(m){r={25:'seller',50:'admin',75:'director'}[g.c.trim().length];if(!r)return toast('Проверьте код')}g.m=0;g.r=r;S.nu=(S.nu||7421)+1;g.done=({buyer:'Пользователь',seller:'Продавец',admin:'Администратор',director:'Директор'})[r]+' №'+S.nu;draw()}
function polHtml(T,q){q=q.toLowerCase();return T.filter(x=>(x[0]+x[1]).toLowerCase().includes(q)).map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')||'<p class="mu">Ничего не найдено.</p>'}
function pol(q){document.getElementById('pl').innerHTML=polHtml(window.PT,q)}
function msgs(id,me){const l=S.msgs[id]||[];if(!l.length)return '<div class="sys">Напишите первое сообщение.</div>';return '<div class="dt">Сегодня</div>'+l.map((m,i)=>m[0]=='x'?`<div class="sys">${esc(m[1])}</div>`:`<div class="bub ${m[0]==me?'me':''}">${m[3]?`<div class="row cl" onclick="pv(${id},${i})"><div class="ic">${ic('doc')}</div><div><b>${esc(m[3].n)}</b><div class="mu">${m[3].s} · Открыть</div></div></div>`:esc(m[1])}<small>${m[2]}${m[0]==me?' ✓':''}</small></div>`).join('')}
function sys(id,t){(S.msgs[id]=S.msgs[id]||[]).push(['x',t,now()])}
function order(pid){const p=pr(pid),id=S.nid++;S.orders.push({id,t:p.t,c:p.c,b:5734,s:p.s,st:0,amt:null,rv:0});sys(id,'Заказ создан. Продавец назовёт сумму.');S.st=[{v:'order',id}];S.tab='orders';toast('Заказ №'+id+' создан');draw()}
function publish(){const d=S.dr;if(!d.t||d.t.trim().length<5)return toast('Заголовок: минимум 5 символов');if(!d.d||d.d.trim().length<20)return toast('Опишите задачу подробнее: минимум 20 символов');if(bad(d.t+' '+d.d))return toast('Контакты в объявлении запрещены');if(!d.ok)return toast('Подтвердите условия академической честности');
 S.ads.unshift({id:S.aid++,t:d.t.trim(),c:d.c||CATS[0][0],d:d.d.trim(),tm:d.tm||TM[1],ty:d.ty||TY[0],b:5734,rs:[]});S.dr={};S.st=[];S.tab='catalog';S.seg='ad';toast('Объявление опубликовано');draw()}
function respond(id){ad(id).rs.push(1048);toast('Отклик отправлен');draw()}
function pick(aid,s){const a=ad(aid),id=S.nid++;S.orders.push({id,t:a.t,c:a.c,b:5734,s,st:0,amt:null,rv:0});S.ads=S.ads.filter(x=>x.id!=aid);sys(id,'Исполнитель выбран. Продавец назовёт сумму.');S.st=[{v:'order',id}];S.tab='profile';toast('Заказ №'+id+' создан');draw()}
function propose(id){const v=parseInt(document.getElementById('am').value,10);if(!(v>0))return toast('Введите сумму больше нуля');const o=or(id);if(o.set)return toast('Сумма уже названа и не меняется');o.amt=v;o.set=true;sys(id,'Продавец назвал сумму');step(id,1,'Сумма отправлена покупателю')}
function o_(id){step(id,8,'Вы отказались от суммы, заказ отменён')}
function step(id,st,t){or(id).st=st;if(S.role=='admin')S.audit.unshift(t+' · заказ №'+id+' · '+now());if(st==7&&!S.led.some(l=>l.o==id)){const o=or(id);S.led.push({o:id,w:'b',a:o.amt,t:o.t},{o:id,w:'s',s:o.s,a:o.amt-fee(o.amt),t:o.t});S.nt.unshift({h:now(),t:'Заказ №'+id+' выполнен. Продавец №'+o.s+' должен платформе '+rub(fee(o.amt))+' за этот заказ. Общий долг продавца: '+rub(Math.max(debt(o.s),0))})}sys(id,ST[st][0]);toast(t);draw()}
function rate(id,n){or(id).rv=n;toast('Спасибо за отзыв');draw()}
function cash(){const v=parseInt(document.getElementById('cs').value,10);if(!(v>0))return toast('Введите сумму больше нуля');S.cash+=v;S.audit.unshift('Получено наличными '+rub(v)+' · '+now());toast('Запись добавлена');draw()}
function adminChat(id){S.audit.unshift('Просмотр переписки заказа №'+id+' · причина: жалоба · '+now());S.st.push({v:'chat',id});draw()}
function send(id){const i=document.getElementById('mi'),t=i.value.trim();if(!t)return;if(bad(t))return toast('Обмен контактами запрещён правилами платформы');
 const me=S.role=='seller'?'s':'b';(S.msgs[id]=S.msgs[id]||[]).push([me,t,now()]);i.value='';document.getElementById('ms').innerHTML=msgs(id,me);document.getElementById('mn').scrollTop=1e5}
const TT={catalog:'Каталог',orders:'Мои заказы',chats:'Чаты',profile:'Профиль',fav:'Избранное',finance:'Финансы',dash:'Панель',policy:'Политика',product:'Предложение',order:'Заказ',newad:'Новое объявление',ad:'Объявление',myads:'Мои объявления',ads:'Заявки',mod:'Модерация',users:'Пользователи',about:'О платформе',bal:'Мои расходы',...window.TTX};
function draw(){const m=document.getElementById('mn'),h=document.getElementById('hd'),f=document.getElementById('ft');
 if(S.splash){h.innerHTML='';f.innerHTML='';m.style.padding='0';m.innerHTML=`<div class="sw"><div style="flex:1"></div>${cap(110)}<h1 style="font-size:38px;letter-spacing:-.03em;margin-top:14px">STUDEX</h1><p class="mu" style="font-size:16px;margin-top:6px">Учись. Находи. Развивайся.</p><div style="flex:1"></div><button class="btn" style="font-size:17px" onclick="S.splash=false;S.reg=1;draw()">Начать</button><p class="mu cl" style="margin:16px 0 8px" onclick="S.splash=false;S.st=[{v:'about'}];draw()">О платформе</p></div>`;return}
 m.style.padding=(S.st[S.st.length-1]||{}).v=='about'?'4px 16px 24px':'';const top=S.st[S.st.length-1],v=top?top.v:S.tab,id=top&&top.id;
 let left=top?`<button class="rb" aria-label="Назад" onclick="back()">${ic('back')}</button>`:v=='catalog'?`<button class="rb" aria-label="Назад" onclick="setTab('home')">${ic('back')}</button>`:'';
 let title=v=='chat'?`<span class="row"><span class="ic" style="border-radius:50%;width:40px;height:40px">${cap(24)}</span><span>${who(or(id))}<br><span class="mu" style="font-weight:400;font-size:12px">Заказ №${id} · ${ST[or(id).st][0]}</span></span></span>`:v=='home'?`<span class="row">${cap(34)}STUDEX</span>`:v=='dash'?`<span class="row">${cap(34)}<span>STUDEX<br><span class="mu" style="font-weight:400;font-size:12px">Панель администратора</span></span></span>`:TT[v];
 h.innerHTML=left+`<h1 style="${top||v=='home'||v=='catalog'||v=='dash'?'font-size:19px':''}">${title}</h1>`+(v=='home'||v=='catalog'||v=='dash'?`<button class="rb" style="position:relative" aria-label="Уведомления" onclick="${S.role=='admin'?"go('notes')":"toast('Новых уведомлений нет')"}">${ic('bell',20)}${S.role=='admin'&&S.nt.length?'<span class="badge" style="position:absolute;top:-4px;right:-4px;background:#ff453a">'+S.nt.length+'</span>':''}</button>`:'');
 m.innerHTML=V[v](id);m.scrollTop=v=='chat'?1e5:0;
 f.innerHTML=v=='chat'&&S.role!='admin'?`<div class="bar"><label class="rb" style="background:none;cursor:pointer" aria-label="Прикрепить файл">${ic('clip',24)}<input type="file" hidden onchange="attach(${id},this)"></label><input id="mi" style="margin:0;border-radius:99px" placeholder="Написать сообщение…" onkeydown="if(event.key=='Enter')send(${id})"><button class="rb" style="background:#f1f1f3;color:#000;width:44px;height:44px" aria-label="Отправить" onclick="send(${id})">${ic('send',20)}</button></div>`
 :v=='about'?'':`<nav>${NAV[S.role].map(n=>`<button class="${S.tab==n[0]&&!top?'on':''}" onclick="setTab('${n[0]}')">${ic(n[1])}${n[2]}</button>`).join('')}</nav>`}
Object.assign(TT,{ddash:'Директор',admins:'Администраторы',dfin:'Финансы',sys:'Система'});draw();
</script><script src="config.js"></script>
